spring:
  application:
    name: cafe-queue
  
  r2dbc:
    url: ${DATABASE_URL:r2dbc:postgresql://localhost:5433/cafe_queue}
    username: ${DATABASE_USERNAME:cafe_user}
    password: ${DATABASE_PASSWORD:cafe_password}

  flyway:
    url: ${FLYWAY_URL:jdbc:postgresql://localhost:5433/cafe_queue}
    user: ${DATABASE_USERNAME:cafe_user}
    password: ${DATABASE_PASSWORD:cafe_password}
    enabled: true
    baseline-on-migrate: true

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cafe_queue}
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
      group-id: ${KAFKA_GROUP_ID:cafe-queue-group}

cafe:
  simulation:
    failure-rate: 0.05

resilience4j.circuitbreaker:
  instances:
    paymentGateway:
      slidingWindowSize: 5
      failureRateThreshold: 50
      waitDurationInOpenState: 15s
      permittedNumberOfCallsInHalfOpenState: 3
      minimumNumberOfCalls: 5

resilience4j.retry:
  instances:
    paymentGateway:
      maxAttempts: 3
      waitDuration: 2s
      enableExponentialBackoff: true
      exponentialBackoffMultiplier: 2